<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accesso - L2 Merkle Sentinel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 flex items-center justify-center">

  <div class="max-w-md w-full bg-slate-800/90 border border-slate-700 p-8 rounded-2xl shadow-2xl space-y-6 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-sky-950 border border-sky-500/40 text-sky-400 text-3xl shadow-inner">
      🌳
    </div>
    <div>
      <h1 class="text-2xl font-black text-white tracking-wide">L2 Merkle Sentinel</h1>
      <p class="text-xs text-slate-400 mt-2 leading-relaxed">
        Piattaforma di notarizzazione forense tramite Merkle Tree e Hash Chain su Arbitrum Sepolia L2.
      </p>
    </div>

    <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700/60 text-left text-xs text-slate-400 space-y-2">
      <div class="flex items-center gap-2 text-slate-300 font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        Autenticazione Crittografica Richiesta
      </div>
      <p>L'accesso richiede la firma di un messaggio non-transazionale tramite MetaMask su rete Arbitrum Sepolia.</p>
    </div>

    <button id="loginBtn" onclick="authenticateUser()" class="w-full bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm">
      <span>🦊</span> Accedi con MetaMask
    </button>

    <div id="gateError" class="hidden p-3 rounded-lg bg-rose-950/60 border border-rose-800 text-rose-300 text-xs font-mono text-left"></div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const saved = sessionStorage.getItem("sentinel_auth");
      if (saved && window.ethereum) {
        const accounts = await window.ethereum.request({ method: "eth_accounts" });
        if (accounts && accounts[0] && accounts[0].toLowerCase() === saved.toLowerCase()) {
          window.location.href = "/dashboard.html";
        }
      }
    });

    async function authenticateUser() {
      const errBox = document.getElementById("gateError");
      const btn = document.getElementById("loginBtn");
      errBox.classList.add("hidden");

      if (!window.ethereum) {
        errBox.classList.remove("hidden");
        errBox.innerText = "MetaMask non rilevato nel browser. Installalo per continuare.";
        return;
      }

      btn.disabled = true;
      btn.innerHTML = "<span>⏳</span> Connessione a MetaMask...";

      try {
        await window.ethereum.request({
          method: "wallet_requestPermissions",
          params: [{ eth_accounts: {} }]
        });

        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: ARBITRUM_SEPOLIA_CHAIN_ID }]
        });

        await initWeb3Connection();

        const timestamp = new Date().toISOString();
        const challengeMessage = `Accedi a L2 Merkle Sentinel\nIndirizzo: ${currentAddress}\nTimestamp: ${timestamp}\nRuolo richiesto: Audit / Management`;

        btn.innerHTML = "<span>✍️</span> Firma il messaggio in MetaMask...";
        await signer.signMessage(challengeMessage);

        sessionStorage.setItem("sentinel_auth", currentAddress.toLowerCase());
        window.location.href = "/dashboard.html";

      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.innerHTML = "<span>🦊</span> Accedi con MetaMask";
        errBox.classList.remove("hidden");
        errBox.innerText = err.code === 4001
          ? "Accesso annullato dall'utente."
          : "Autenticazione fallita: " + (err.message || err);
      }
    }
  </script>
</body>
</html>
